<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161718">
<title>VARMEKS QC — Kontrol Kartı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23161718'/%3E%3Cpath d='M13 15h9.5l9.5 25 9.5-25H51L37 50h-10z' fill='%23C8102E'/%3E%3C/svg%3E">
<style>
:root{
  --coal:#161718; --graphite:#1F2123; --graphite2:#272A2D; --steel:#35393D; --rule:#2A2D30;
  --ash:#8E949A; --lime:#E4E5E3; --red:#C8102E; --ok:#5E9E6E; --warn:#C08A3E; --na:#6D7378;
  --grain:none;
  --f:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--coal)}
body{margin:0;color:var(--lime);font-family:var(--f);font-size:15px;line-height:1.45;
  background-color:var(--coal);background-image:var(--grain);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #E4E5E3;outline-offset:2px}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>div{min-width:0}
.rail{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--steel);
  background-color:#131415;background-image:var(--grain);display:flex;flex-direction:column;gap:28px}
.emblem svg{display:block;width:170px;height:auto}
.emblem .sub{color:var(--ash);font-size:13px;margin-top:8px;padding-left:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:10px 12px;border-radius:5px;color:var(--ash);cursor:pointer;font-size:15px;position:relative}
.nav button:hover{color:var(--lime);background:#1C1E20}
.nav button[aria-current="page"]{color:var(--lime);background:var(--graphite2)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--red)}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;color:#5f656a;font-size:12px;line-height:1.5}
.topbar,.bnav{display:none}
main{padding:30px 34px 60px;max-width:1160px;width:100%}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;line-height:1.15}
h2{font-size:19px;font-weight:600;margin:0 0 12px}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
p{margin:0 0 10px;max-width:78ch}
.lead{color:var(--ash);margin-bottom:22px}
.panel{background-color:var(--graphite);background-image:var(--grain);border:1px solid var(--steel);border-radius:8px;padding:18px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.muted{color:var(--ash)}
.small{font-size:13px}
.btn{background:var(--graphite2);border:1px solid var(--steel);color:var(--lime);border-radius:5px;padding:9px 14px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:#4a4f54}
.btn.pri{background:var(--lime);color:var(--coal);border-color:var(--lime)}
.btn.pri:hover{background:#fff}
.btn.ghost{background:none}
.btn.danger{color:#F3A0A9;border-color:#5a2a30;background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lb{display:block;font-size:12.5px;color:var(--ash);margin-bottom:5px}
.in{background:#131415;border:1px solid var(--steel);border-radius:5px;padding:9px 10px;width:100%;color:var(--lime)}
.in:focus{border-color:#5d6369;outline:none}
textarea.in{resize:vertical;min-height:62px}
.seg-btns{display:flex;gap:6px;flex-wrap:wrap}
.seg-btns button{background:#131415;border:1px solid var(--steel);border-radius:5px;padding:8px 12px;color:var(--ash);cursor:pointer;font-weight:600}
.seg-btns button[aria-pressed="true"]{background:var(--lime);color:var(--coal);border-color:var(--lime)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--steel);border:1px solid var(--steel);border-radius:8px;overflow:hidden}
.kpi{background-color:var(--graphite);background-image:var(--grain);padding:14px 14px 12px}
.kpi b{display:block;font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ash)}
.kpi.alert b{color:#F3A0A9}
/* line strip */
.line{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.seg{height:8px;border-radius:2px;background:#2C2F33}
.line.big .seg{height:16px}
.seg.ok{background:var(--ok)} .seg.nok{background:var(--warn)} .seg.hold{background:var(--red)}
.seg.part{background:linear-gradient(90deg,#7B8288 0 50%,#2C2F33 50% 100%)}
.seg.none{background:transparent;border:1px dashed #33373b}
.seg-l{display:block;font-size:11.5px;color:var(--ash);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .seg{height:auto;min-height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 5px;border-radius:4px}
.heat .seg b{font-size:20px;font-weight:600;line-height:1}
.heat .seg small{font-size:11px;color:rgba(228,229,227,.7)}
/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 9px;border-radius:4px;border:1px solid var(--steel);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:#8FCB9E;border-color:#2f4a36}
.st.nok{color:#E2B26A;border-color:#5a4426}
.st.hold{color:#fff;background:var(--red);border-color:var(--red)}
.st.run{color:var(--ash)}
/* chips */
.chip{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--steel);color:var(--ash);white-space:nowrap}
.chip.K{color:#F3A0A9;border-color:#5a2a30}
.chip.M{color:#D9B47C;border-color:#54442b}
.chip.rec{border-style:dashed;color:#cfd3d6}
.chip.bad{color:#F3A0A9;border-color:#5a2a30}
.chip.good{color:#8FCB9E;border-color:#2f4a36}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--ash);font-weight:600;text-align:left;border-bottom:1px solid var(--steel);padding:8px 8px;font-size:13px}
.tbl td{border-bottom:1px solid var(--rule);padding:9px 8px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
/* bars */
.bar{height:10px;background:#2C2F33;border-radius:2px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--warn)}
.bar.red i{background:var(--red)}
.bar.ok i{background:var(--ok)}
.bar.ash i{background:#7B8288}
/* list */
.rec-row{display:grid;grid-template-columns:1.2fr 1fr 150px 70px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit}
.rec-row:hover{background:#232528}
.grp{border:1px solid var(--steel);border-radius:8px;overflow:hidden;background-color:var(--graphite);background-image:var(--grain)}
.grp-h{display:grid;grid-template-columns:1.2fr 1fr 150px 70px;gap:14px;align-items:center;padding:14px;width:100%;background:none;border:0;cursor:pointer;text-align:left;color:inherit}
.grp-h:hover{background:#232528}
.serial{font-size:17px;font-weight:600;letter-spacing:.01em}
/* checklist */
.station{border:1px solid var(--steel);border-radius:8px;overflow:hidden;background-color:var(--graphite);background-image:var(--grain)}
.station-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;background:#1A1C1E;border-bottom:1px solid var(--steel)}
.station-h h3{margin:0;font-size:15.5px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--rule)}
.item:first-of-type{border-top:0}
.item.isnok{box-shadow:inset 3px 0 0 var(--warn)}
.item.iscrit{box-shadow:inset 3px 0 0 var(--red)}
.item .p{font-weight:600}
.item .no{color:var(--ash);margin-right:6px;font-weight:500}
.item .spec{color:var(--ash);font-size:13.5px;margin:2px 0 6px}
.marks{display:grid;grid-template-columns:auto auto;gap:6px 10px;align-items:center;justify-items:end}
.marks .who{font-size:12px;color:var(--ash)}
.mk{display:flex;gap:4px}
.mk button{min-width:46px;height:34px;border-radius:5px;border:1px solid var(--steel);background:#131415;color:var(--ash);font-weight:700;cursor:pointer;font-size:13px}
.mk button[aria-pressed="true"][data-v="OK"]{background:var(--ok);border-color:var(--ok);color:#0e1a12}
.mk button[aria-pressed="true"][data-v="NOK"]{background:var(--warn);border-color:var(--warn);color:#1d1408}
.mk button[aria-pressed="true"][data-v="NA"]{background:var(--na);border-color:var(--na);color:#111}
.meas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.meas .in{width:120px;padding:7px 9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--steel);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--ash);cursor:pointer;font-weight:600;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--lime);border-bottom-color:var(--lime)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.back{background:none;border:0;color:var(--ash);cursor:pointer;padding:0;margin-bottom:12px;font-weight:600}
.back:hover{color:var(--lime)}
.empty{padding:28px;text-align:center;color:var(--ash)}
.note{border-left:3px solid var(--steel);padding:2px 0 2px 12px;color:var(--ash);font-size:13.5px}
.issue{border-top:1px solid var(--rule);padding:12px 0}
.issue:first-child{border-top:0;padding-top:0}
.cloudst{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ash);white-space:nowrap}
.cloudst::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--na);flex:none}
.cloudst.st-ok::before{background:var(--ok)}.cloudst.st-sync::before,.cloudst.st-wait::before{background:var(--warn)}
.cloudst.st-err::before,.cloudst.st-login::before{background:var(--red)}
.topbar .cloudst{margin-left:auto}
.lab{display:block;font-size:13px;color:var(--ash);margin:0 0 12px}.lab .in{margin-top:5px}
#login{position:fixed;inset:0;z-index:60;background:rgba(14,15,16,.96);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
.lgbox{width:100%;max-width:380px;background:var(--graphite);border:1px solid var(--steel);border-radius:10px;padding:26px}
.lgbox .emblem svg{width:150px;margin-bottom:18px}
.lgerr{color:#F3A0A9;font-size:13px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--lime);color:var(--coal);padding:10px 16px;border-radius:6px;font-weight:600;z-index:50;max-width:90vw}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--steel);background-color:#131415;background-image:var(--grain);position:sticky;top:0;z-index:20}
  .topbar svg{width:118px;height:auto}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--steel);
    background-color:#131415;background-image:var(--grain);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{background:none;border:0;color:var(--ash);padding:9px 2px 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .bnav button[aria-current="page"]{color:var(--lime)}
  .bnav svg{width:20px;height:20px}
  main{padding:18px 14px 96px}
  h1{font-size:24px}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rec-row,.grp-h{grid-template-columns:1fr auto;gap:8px}
  .rec-row .hide-m,.grp-h .hide-m{display:none}
  .item{grid-template-columns:1fr}
  .marks{justify-items:start}
  .line.big .seg-l{display:none}
  .heat{grid-template-columns:repeat(11,minmax(58px,1fr))}
  .seg-btns button{padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function cloudPush() {

  var d = dirty();
  if (!d.n) { setCloud("ok"); return; }
  cloud.busy = true; setCloud("sync");
  try {
    var who = cloud.user.email || "";
    for (var i = 0; i < d.up.length; i += 200) {
      var part = d.up.slice(i, i + 200);
      var res = await cloud.sb.from("qc_records").upsert(part.map(function (x) { return { id: x.id, data: x.data, updated_by: who }; }));
      if (res.error) throw res.error;
      part.forEach(function (x) { SYN.r[x.id] = x.j; }); synSave();
    }
    if (d.del.length) {
      var rd = await cloud.sb.from("qc_records").delete().in("id", d.del);
      if (rd.error) throw rd.error;
      d.del.forEach(function (id) { delete SYN.r[id]; }); synSave();
    }
    if (d.set != null) {
      var rs = await cloud.sb.from("qc_settings").upsert({ id: 1, data: S.settings, updated_by: who });
      if (rs.error) throw rs.error;
      SYN.s = d.set; synSave();
    }
    cloud.last = new Date(); setCloud("ok");
  } catch (e) {
    setCloud("err", errText(e)); cloud.retry = setTimeout(cloudPush, 20000);

  if (cloud.again) { cloud.again = false; cloudPush(); } else if (cloud.state === "ok" && dirty().n) cloudPush();
}
async function cloudPull() {
  var all = [], from = 0;
  for (;;) {
    var r = await cloud.sb.from("qc_records").select("id,data").order("id").range(from, from + 999);
    if (r.error) throw r.error;
    all = all.concat(r.data || []); if (!r.data || r.data.length < 1000) break; from += 1000;
  }
  var st = await cloud.sb.from("qc_settings").select("data").eq("id", 1).maybeSingle();
  if (st.error) throw st.error;
  return { recs: all, set: st.data ? st.data.data : null };
}

function softRender() {

function subscribe() {
  if (cloud.ch) return;
  cloud.ch = cloud.sb.channel("qc-records").on("postgres_changes", { event: "*", schema: "public", table: "qc_records" }, function (pl) {
    var i;
    if (pl.eventType === "DELETE") {
      var id = pl.old && pl.old.id; if (!id) return;
      i = S.records.findIndex(function (r) { return r.id === id; });
      if (i >= 0 && SYN.r[id] !== canon(S.records[i])) return; // bu cihazda gönderilmemiş değişiklik var
      delete SYN.r[id]; if (i >= 0) S.records.splice(i, 1);
      if (ui.rec === id) ui.rec = null;
    } else {
      var row = pl.new; if (!row || !row.id) return;
      var j = canon(row.data);
      i = S.records.findIndex(function (r) { return r.id === row.id; });
      if (i >= 0) {
        var cur = canon(S.records[i]);
        if (cur === j) { SYN.r[row.id] = j; synSave(); return; } // kendi kaydımızın yankısı
        if (SYN.r[row.id] !== cur) return; // bu cihazda gönderilmemiş değişiklik var, yerel kazanır
        S.records[i] = row.data;
      } else S.records.push(row.data);
      SYN.r[row.id] = j;
    }
    synSave(); saveLocal(); softRender();
  }).subscribe();
}

function evalMeas(r, it, val) {

  var v = parseFloat(String(val).replace(",", ".")); if (isNaN(v)) return null;

  var numeric = items.filter(function (it) { return /\d/.test(it.k) && /(bar|mpa|gram|kw)/i.test(it.k); }).length;
  var stC = {}; items.forEach(function (it) { stC[it.st] = (stC[it.st] || 0) + 1; });

}

    case "open": ui.rec = b.dataset.id; ui.tab = "liste"; window.scrollTo(0, 0); break;
    case "back": ui.rec = null; break;
    case "tab": ui.tab = v; break;
    case "crit": ui.critOnly = !ui.critOnly; break;
    case "mark":
      if (!r) return; var no = b.dataset.no, col = b.dataset.col, m = Object.assign({}, r.marks[no] || {});
      m[col] = m[col] === v ? "" : v; r.marks[no] = m; save(); break;
    case "allok":
      if (!r) return; itemsFor(r.deviceKey).forEach(function (it) { var mm = Object.assign({}, r.marks[it.no] || {}); if (!mm.op) mm.op = "OK"; if (!mm.qc) mm.qc = "OK"; r.marks[it.no] = mm; }); save(); toast("Boş kalan tüm onaylar uygun olarak işaretlendi."); break;
    case "clear":
      if (!r || !confirm("Bu karttaki tüm işaretler temizlensin mi? Ölçülen değerler korunur.")) return;
      Object.keys(r.marks).forEach(function (k) { r.marks[k] = { val: r.marks[k].val }; }); save(); break;
    case "ncrfrom":
      if (!r) return; var it = itemsFor(r.deviceKey).find(function (x) { return x.no === b.dataset.no; });
      r.ncr = r.ncr || []; r.ncr.push({ id: uid(), item: it.no, hata: it.p + ": uygun değil", alinan: it.st, farkedilen: it.st, analiz: "", duzeltme: "", durum: "Açık" }); ui.tab = "ncr"; save(); window.scrollTo(0, 0); break;
    case "ncradd": if (!r) return; r.ncr = r.ncr || []; r.ncr.push({ id: uid(), item: "", hata: "", alinan: "", farkedilen: "", analiz: "", duzeltme: "", durum: "Açık" }); save(); break;
    case "ncrdel": if (!r || !confirm("Uygunsuzluk kaydı silinsin mi?")) return; r.ncr = r.ncr.filter(function (x) { return x.id !== b.dataset.id; }); save(); break;
    case "ncrdurum": if (!r) return; var n = r.ncr.find(function (x) { return x.id === b.dataset.id; }); if (n) n.durum = v; save(); break;
    case "ncrsinif": if (!r) return; var ns = r.ncr.find(function (x) { return x.id === b.dataset.id; }); if (ns) ns.sinif = ns.sinif === v ? "" : v; save(); break;
    case "ncrneden": if (!r) return; var nn = r.ncr.find(function (x) { return x.id === b.dataset.id; }); if (nn && HTIP_BY[nn.tip]) { var nd = HTIP_BY[nn.tip].neden[+b.dataset.i]; if (nn.neden === nd[0]) { nn.neden = ""; } else { nn.neden = nd[0]; nn.sinif = nd[1]; } } save(); break;
    case "sug1": var sr = S.records.find(function (x) { return x.id === b.dataset.r; }); var sn = sr && (sr.ncr || []).find(function (x) { return x.id === b.dataset.id; }); if (sn && applySug(sn)) { save(); toast("Öneri uygulandı."); } break;
    case "sugall": var cA = 0, cF = 0; allNcr().forEach(function (x) { if (applySug(x.n)) cA++; }); allFire().forEach(function (x) { if (!x.f.sinif) { var fs = suggestFire(x.r, x.f); if (fs) { x.f.sinif = fs; cF++; } } }); save(); toast(cA + " uygunsuzluk ve " + cF + " fire kaydına öneri uygulandı. Kontrol edip gerekirse düzeltin."); break;
    case "hf": ui.hf = v; break;
    case "hs": ui.hs = v; break;
    case "normst": var cN = normalizeAll(); save(); toast(cN ? cN + " istasyon adı standartlaştırıldı." : "Düzeltilecek istasyon adı yok."); break;
    case "printh": printHatalar(); return;
    case "gotonc": ui.view = "kontrol"; ui.rec = b.dataset.r; ui.tab = "ncr"; window.scrollTo(0, 0); break;
    case "fireadd": if (!r) return; r.fire = r.fire || []; r.fire.push({ code: "", qty: "", station: "", explanation: "" }); save(); break;
    case "firedel": if (!r) return; r.fire.splice(+b.dataset.i, 1); save(); break;
    case "print": if (r) printRec(r); return;
    case "printan": printAnaliz(); return;
    case "delrec": if (!r || !confirm("Kontrol kartı " + (r.serial || "") + " silinsin mi?")) return; S.records = S.records.filter(function (x) { return x.id !== r.id; }); ui.rec = null; save(); break;
    case "seedload": if (!window.__QC_SEED || !confirm("Tarayıcıdaki " + S.records.length + " kart, dosyadaki " + window.__QC_SEED.records.length + " kartla değiştirilecek. Önce yedek almanız önerilir. Devam edilsin mi?")) return; S = JSON.parse(JSON.stringify(window.__QC_SEED)); S.settings = Object.assign({}, DEF.settings, S.settings || {}); normalizeAll(); save(); toast(S.records.length + " kart yüklendi."); break;
    case "export": download("VARMEKS_QC_yedek_" + today() + ".json", JSON.stringify(S, null, 1)); toast("Yedek indirildi."); return;
    case "import": var fi = document.getElementById("fileIn"); if (fi) fi.click(); return;
    case "nlocal":
      var raw = null; try { raw = localStorage.getItem("vrm-tracker-v2"); } catch (e) {}
      if (!raw) { toast("Bu tarayıcıda Note Loop verisi bulunamadı. Note Loop'tan yedek indirip dosyadan aktarın."); return; }
      try { var cnt = fromNoteLoop(JSON.parse(raw)); toast(cnt ? cnt + " kart aktarıldı." : "Aktarılacak yeni kart bulunamadı."); if (cnt) { ui.view = "kontrol"; ui.rec = null; } } catch (e) { toast("Note Loop verisi okunamadı."); }
      break;
    case "togrec": S.settings.showRec = !!b.checked; save(); break;
    case "csync": if (cloud.user) cloudStart(); else if (cloud.sb) showLogin(); return;
    case "logout": cloudLogout(); return;
    case "wipe": if (!confirm("Tüm kontrol kartları silinecek" + (cloud.user ? " (buluttan da)" : "") + ". Emin misiniz?")) return; S.records = []; save(); toast("Tüm kartlar silindi."); break;
    default: return;
  }
  render();
});

/* ---------------- render ---------------- */
function render() {
  renderNav();
  var v = document.getElementById("v"), r = curRec();
  if (ui.view === "kontrol" && r) v.innerHTML = viewDetail(r);
  else if (ui.view === "kontrol") { ui.rec = null; v.innerHTML = viewList(); }
  else if (ui.view === "hatalar") v.innerHTML = viewHatalar();
  else if (ui.view === "analiz") v.innerHTML = viewAnaliz();
  else if (ui.view === "veri") v.innerHTML = viewVeri();
  else v.innerHTML = viewPanel();
}
function grain() {
  try {
    var c = document.createElement("canvas"); c.width = c.height = 140; var x = c.getContext("2d"); if (!x) return;
    var img = x.createImageData(140, 140), d = img.data;
    for (var i = 0; i < d.length; i += 4) { var g = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 13; }
    x.putImageData(img, 0, 0);
    document.documentElement.style.setProperty("--grain", "url(" + c.toDataURL("image/png") + ")");
  } catch (e) {}
}
document.getElementById("emblemRail").innerHTML = emblem() + '<div class="sub">Kalite kontrol</div>';
document.getElementById("emblemTop").innerHTML = emblem();
grain();
if (normalizeAll()) save();
render();
cloudInit();
window.__QC = { cloud: cloud, SYN: function () { return SYN; }, S: function () { return S; }, ui: ui, evalRec: evalRec, itemsFor: itemsFor, analysisData: analysisData };
})();

</script>
