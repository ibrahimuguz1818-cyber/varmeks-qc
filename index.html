<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<title>VARMEKS QC — Kontrol Kartı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23161718'/%3E%3Cpath d='M13 15h9.5l9.5 25 9.5-25H51L37 50h-10z' fill='%23C8102E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --ink2:#4A4A4A; --muted:#6E6E6E; --faint:#767676; --line:#E6E6E6; --line2:#EFEFEF;
  --soft:#F4F4F4; --grp:#F1F1F1; --red:#E04F2E; --red-ink:#B4321A; --red-soft:#FDF1EE; --ok:#0F8A5F; --ok-ink:#0F7A54;
  --warn:#9A5B0C; --warn-soft:#FBF1E1; --dark:#17140F; --brand:#C8102E;
  --f:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --c-op:#1E4FD8; --c-ted:#E04F2E; --c-mal:#B7791F; --c-tas:#7C3AED; --c-mak:#0F8A5F; --c-pro:#475467; --c-olc:#0E7490; --c-tsr:#9D174D;
  /* eski adlar (diğer sayfalar için) */
  --ash:var(--muted); --lime:var(--ink); --steel:var(--line); --rule:var(--line2); --graphite:var(--soft); --graphite2:#FFFFFF; --coal:var(--bg); --na:#9A9A9A;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;letter-spacing:-.01em;background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* üst menü */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;min-height:68px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:6px;white-space:nowrap}
.brand b{font-weight:600;font-size:14px;letter-spacing:.22em}
.brand i{width:1px;height:16px;background:#CFCFCF}
.brand span{font-size:14px;color:var(--muted)}
.mnav{display:flex;align-items:center;gap:8px;min-width:0}
.mnav .grp{display:flex;gap:2px;background:var(--grp);border-radius:999px;padding:6px}
.mnav button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:500;white-space:nowrap;min-height:38px}
.mnav button:hover{background:#E7E7E7}
.mnav .on{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 20px 6px 6px;font-weight:500;font-size:14.5px;min-height:44px;border:0}
.mnav .on:hover{background:var(--ink)}
.mnav .on .dot{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.mnav .on .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--grp);border-radius:999px;padding:4px}
.syncpill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:600;border:0;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center}
.ib svg{width:18px;height:18px}
main{padding:0 0 64px;position:relative;z-index:0}
.hz{isolation:isolate}
.mnav .grp,.mnav .on{flex:none}
main>.wrap{padding-top:28px}

/* tipografi */
h1{font-weight:500;font-size:clamp(40px,4.6vw,60px);letter-spacing:-.045em;line-height:1;margin:6px 0 8px}
h1 .g{color:#ADADAD}
h2{font-weight:500;font-size:22px;letter-spacing:-.02em;margin:0 0 12px;line-height:1.2}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
p{margin:0 0 10px;max-width:80ch}
.lead{color:var(--muted);font-size:15px;margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sechead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:0 0 18px}
.sechead h2{font-size:36px;letter-spacing:-.03em;line-height:1.1;margin:0}
.sechead p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.sechead .right{margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ortak */
.panel{background:var(--soft);border-radius:18px;padding:20px}
.panel.white{background:#fff;border:1px solid var(--line)}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:0 18px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;gap:8px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#BDBDBD}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.btn.pri:hover{background:#2A2A2A}
.btn.ghost{background:none}
.btn.danger{color:var(--red-ink);border-color:#F2C4B8}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.btn[disabled]{background:var(--line);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.lb{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.in{background:#fff;border:1px solid #E0E0E0;border-radius:12px;padding:0 14px;min-height:44px;width:100%;color:var(--ink)}
select.in{padding-right:8px}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{resize:vertical;min-height:72px;padding:10px 14px}
.seg-btns{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--grp);border-radius:999px;padding:4px}
.seg-btns button{background:none;border:0;border-radius:999px;padding:8px 14px;color:var(--ink);font-weight:500;font-size:13px;min-height:36px}
.seg-btns button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{min-height:36px;border:1px solid #E0E0E0;background:#fff;border-radius:999px;padding:0 12px;font-size:12.5px;font-weight:500}
.chipsel button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dotc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);vertical-align:middle}

/* sayaç kartları */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{position:relative;background:var(--soft);border-radius:18px;padding:18px 20px;border:0;text-align:left;color:inherit;display:block;width:100%}
button.kpi:hover{background:#EDEDED}
.kpi b{display:block;font-size:36px;font-weight:400;letter-spacing:-.03em;line-height:1.1}
.kpi span{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px;color:var(--ink)}
.kpi small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--red-ink)}
.kpi .arr{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px}

/* hat şeridi */
.line{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.seg{height:8px;border-radius:999px;background:#E9E9E9}
.line.big .seg{height:10px}
.seg.ok{background:var(--ink)} .seg.nok{background:#E8916F} .seg.hold{background:var(--red)}
.seg.part{background:linear-gradient(90deg,#9A9A9A 0 50%,#E9E9E9 50% 100%)}
.seg.none{background:transparent;border:1px dashed #D5D5D5}
.seg-l{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* durum */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--grp);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok-ink)} .st.nok{color:var(--red-ink)} .st.hold{color:#fff;background:var(--red)} .st.run{color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--grp);color:var(--ink2);white-space:nowrap}
.chip.K{background:#FDE7E1;color:var(--red-ink)} .chip.M{background:var(--warn-soft);color:var(--warn)} .chip.rec{background:#fff;border:1px dashed #BDBDBD}
.chip.bad{background:#FDE7E1;color:var(--red-ink)} .chip.good{background:#E3F4EC;color:var(--ok-ink)}

/* tablolar ve çubuklar */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--ink);padding:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tbl td{border-bottom:1px solid var(--line2);padding:10px 8px;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.scroll{overflow-x:auto}
.bar{height:8px;background:#E9E9E9;border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bar.red i{background:var(--red)} .bar.ok i{background:var(--ok)} .bar.ash i{background:#8A8A8A}
.panel .bar{background:#fff}

/* liste */
.grp-list{display:flex;flex-direction:column;gap:10px}
.grp{border-radius:18px;overflow:hidden;background:var(--soft)}
.rec-row,.grp-h{display:grid;grid-template-columns:1.2fr 1fr 150px 70px;gap:14px;align-items:center;padding:14px 18px;width:100%;background:none;border:0;text-align:left;color:inherit}
.rec-row{border-top:1px solid #E7E7E7;background:#fff}
.rec-row:hover{background:#FAFAFA}
.grp-h:hover{background:#EDEDED}
.serial{font-size:17px;font-weight:500;letter-spacing:-.01em;font-family:var(--mono)}

/* sekmeler ve araç çubuğu */
.tabs{display:inline-flex;gap:2px;background:var(--grp);border-radius:999px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-radius:999px;padding:9px 16px;font-weight:500;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.back{background:none;border:0;color:var(--muted);padding:0;min-height:32px;font-size:13px}
.back:hover{color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:13.5px}
.issue{border-top:1px solid var(--line);padding:12px 0}
.issue:first-child{border-top:0;padding-top:0}

/* bulut durumu, giriş, bildirim */
.cloudst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}
.cloudst::before{content:"";width:7px;height:7px;border-radius:50%;background:#9A9A9A;flex:none}
.cloudst.st-ok::before{background:#22C55E}.cloudst.st-sync::before,.cloudst.st-wait::before{background:#F5B342}
.cloudst.st-err::before,.cloudst.st-login::before{background:var(--red)}
.lab{display:block;font-size:12px;color:var(--ink2);margin:0 0 12px}.lab .in{margin-top:6px}
#login{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;padding:16px}
.lgbox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.lgbox .emblem svg{width:150px;margin-bottom:18px;display:block}
.lgerr{color:var(--red-ink);font-size:13px;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:500;z-index:50;max-width:90vw;font-size:13.5px}

/* PANEL: giriş */
.hero{position:relative;display:grid;place-items:center;min-height:340px;margin-top:8px}
.hero .orb{position:absolute;width:330px;height:330px;border-radius:50%;border:1px solid #EDEDED;background:radial-gradient(circle,#EFEFEF 0%,#FAFAFA 55%,#FFFFFF 100%)}
.hero h1{position:relative;text-align:center;font-size:clamp(46px,6.4vw,92px);line-height:.98;margin:0}
.herofoot{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;margin:30px 0 40px}
.herofoot .txt{flex:1 1 340px;max-width:460px}
.herofoot .txt p{margin:0 0 8px}
.herofoot .big{font-size:17px;line-height:1.4;letter-spacing:-.015em}
.herofoot .cta{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;border-left:1px solid var(--ink);padding-left:24px;min-height:84px;align-items:center}
.hr{border:0;border-top:1px solid var(--line);margin:0}

/* PANEL: seri bandı */
.hz{position:relative;overflow:hidden}
.hz-belt{position:relative;width:100%;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hz-belt.drag{cursor:grabbing}
.hz-codes,.hz-cards{position:absolute;inset:0}
.hz-codes{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.hz-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hz-card,.hz-code{position:absolute;left:0;top:0;will-change:transform}
.hz-card{border-radius:28px;overflow:hidden;color:#F4ECDD;padding:26px;display:flex;gap:24px;cursor:pointer}
.hz-code{overflow:hidden;pointer-events:none;padding:12px 18px 0 6px;color:var(--ink)}
.hz-plate{flex:0 0 31%;border-radius:8px;padding:18px 16px;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.hz-plate b{font-size:27px;font-weight:600;line-height:1;letter-spacing:-.01em}
.hz-plate small{margin-top:10px;font-family:var(--mono);font-size:10px;opacity:.8;line-height:1.5}
.hz-plate hr{width:40%;border:0;border-top:1px solid currentColor;opacity:.4;margin:14px 0}
.hz-plate em{margin-top:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
.hz-info{flex:1;min-width:0;display:flex;flex-direction:column}
.hz-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;opacity:.72}
.hz-ttl{font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1.02;margin-top:10px}
.hz-by{font-size:13px;opacity:.85;margin-top:6px}
.hz-barw{margin-top:auto;height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.hz-barw i{display:block;height:100%;background:rgba(255,255,255,.85)}
.hz-pl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;opacity:.75;margin-top:7px}
.hz-stt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.hz-stt div{border-top:1px solid rgba(255,255,255,.28);padding-top:8px}
.hz-stt b{display:block;font-size:26px;font-weight:300;letter-spacing:-.04em;line-height:1}
.hz-stt span{font-size:11px;opacity:.75}
.hz-def .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);display:flex;justify-content:space-between;gap:10px}
.hz-def .t{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.hz-def .a{font-size:12.5px;color:var(--muted);margin-top:4px}
.hz-def .a b{color:var(--ink);font-weight:500}
.hz-def ol{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.hz-def li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #F0F0F0;font-size:12.5px;line-height:1.3}
.hz-def li i{font-style:normal;font-family:var(--mono);font-size:11px}
.hz-def li.bad{color:var(--red-ink);font-weight:600}
.hz-scan{position:absolute;width:0;pointer-events:none;z-index:3}
.hz-scan i{position:absolute;left:-2px;top:0;bottom:0;width:4px;border-radius:4px;background:var(--ink);box-shadow:0 0 8px 1px rgba(17,17,17,.28),0 0 26px 6px rgba(17,17,17,.12)}
.hz-scan b{position:absolute;left:0;top:4%;bottom:4%;width:42px;background:linear-gradient(90deg,rgba(17,17,17,.18),transparent);filter:blur(6px)}
.hz-badge{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:4}
.hz-badge .lb{font-size:11.5px;color:var(--muted);white-space:nowrap;margin:0}
.hz-pill{display:flex;height:26px;border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.hz-pill .n{background:var(--ink);color:#fff;padding:0 11px 0 13px;min-width:7ch;display:flex;align-items:center;justify-content:flex-end}
.hz-pill .p{background:var(--grp);color:var(--ink);font-size:11px;padding:0 12px 0 10px;display:flex;align-items:center}
.hzrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:6px 0 30px;font-size:13px;color:var(--muted)}
.hzrow b{color:var(--ink);font-weight:500}

/* PANEL: bulgu kartı */
.finding{background:var(--soft);border-radius:26px;padding:32px;display:flex;flex-wrap:wrap;gap:28px}
.finding .l{flex:1 1 380px;min-width:0}
.finding .l h3{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:8px 0 12px}
.finding .r{flex:1 1 420px;min-width:0;background:#fff;border-radius:18px;padding:24px}
.hbar{display:grid;grid-template-columns:170px minmax(0,1fr) 30px;align-items:center;gap:12px;font-size:13px;margin-bottom:10px}
.hbar .t{height:8px;border-radius:999px;background:#fff}
.hbar .t i{display:block;height:8px;border-radius:999px;background:var(--ink)}
.hbar .v{font-family:var(--mono);text-align:right}
.rc4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin-top:14px}
.rc4 b{display:block;font-size:34px;font-weight:400;letter-spacing:-.03em;line-height:1}
.rc4 span{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tchips span{background:var(--grp);border-radius:999px;padding:6px 10px;font-size:12.5px}

/* KONTROL KARTI */
.cardhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px}
.cardhead .l{flex:1 1 420px;min-width:0}
.cardhead h1{font-family:var(--f)}
.cardhead .meta{font-size:14px;color:var(--muted);margin:0}
.people{display:flex;flex-wrap:wrap;gap:8px}
.people label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.people .in{width:180px;border-radius:999px;padding:0 16px}
.ctool{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.prog{display:inline-flex;border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:12px}
.prog b{background:var(--ink);color:#fff;padding:5px 12px;font-weight:400}
.prog span{background:var(--grp);padding:5px 12px}
.allok{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.allok .lbl{font-size:13px;color:var(--muted)}

.srail{flex:1 1 220px;max-width:260px;min-width:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:84px}
.srail button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:13.5px;font-weight:500;text-align:left}
.srail button:hover{background:var(--grp)}

.srail .ic{width:16px;text-align:center;font-size:12px}
.srail .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srail .nk{font-family:var(--mono);font-size:10.5px;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.srail .ct{font-family:var(--mono);font-size:11px;opacity:.7}
.citems{flex:999 1 560px;min-width:0}
.ihead,.irow{display:grid;grid-template-columns:40px minmax(0,1fr) 160px 160px;gap:12px;align-items:center}
.ihead{padding:0 14px 8px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.sgrp{margin-bottom:14px}
.sgrp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:12px 14px 8px;border-top:1px solid var(--ink)}
.sgrp-h h3{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.sgrp-h .ct{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.item{border-bottom:1px solid var(--line2)}
.item.isnok{background:var(--red-soft)}
.irow{padding:12px 14px}
.irow .no{font-family:var(--mono);font-size:13px;color:var(--muted)}
.irow .p{font-size:14.5px;font-weight:500}
.irow .spec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.irow .code{font-family:var(--mono);font-size:11.5px;background:var(--grp);color:var(--ink);border-radius:6px;padding:2px 7px}
.meas{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.meas .in{width:100px;min-height:34px;border-radius:999px;padding:0 12px;font-family:var(--mono);font-size:13px}
.meas .in.warn{border-color:#E6B877}.meas .in.bad{border-color:var(--red)}.meas .in.good{border-color:#9FD3BE}
.meas .m{font-size:12px;font-weight:500}
.meas .m.warn{color:var(--warn)}.meas .m.bad{color:var(--red-ink)}.meas .m.good{color:var(--ok-ink)}
.mk{display:flex;background:var(--grp);border-radius:999px;padding:3px;gap:2px}
.mk button{flex:1;min-height:38px;border:0;border-radius:999px;background:none;color:var(--muted);font-size:12.5px;font-weight:600}
.mk button.na{flex:0 0 40px;font-size:11px}
.mk button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mk button[aria-pressed="true"][data-v="NOK"]{background:var(--red)}
.mk button[aria-pressed="true"][data-v="NA"]{background:#8A8A8A}
.who{display:none;font-size:11px;color:var(--muted)}
.ncrstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 14px 12px 66px;padding:10px 12px;background:#fff;border:1px solid #F2C4B8;border-radius:14px;font-size:12.5px}
.ncrstrip .cd{font-family:var(--mono);font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:2px 8px}
.ncrstrip .res{margin-left:auto;font-weight:500}
.nf{margin:0 14px 14px 66px;padding:18px;background:#fff;border:1.5px solid var(--red);border-radius:18px}
.nf .stp{font-size:12px;font-weight:600;margin:16px 0 8px}
.nf .stp span{font-weight:400;color:var(--muted)}
.nf .why{display:flex;flex-direction:column;gap:6px}
.nf .why button{display:flex;align-items:center;gap:10px;min-height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;font-size:13px;text-align:left}
.nf .why button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.nf .why .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.nf .why button[aria-pressed="true"] .rd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.nf .why .tx{flex:1}
.nf .why .sf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}

.nf .firebox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.nf .firebox p{flex-basis:100%;margin:0;font-size:12px;color:#7A5A1E}

.sum3 span{font-size:12px;color:var(--ink2)}

.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mcards button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:120px;padding:16px;border-radius:18px;border:2px solid transparent;background:var(--soft);text-align:left}

.mcards span{margin-top:auto;font-size:12px;opacity:.85}
.stepper{display:flex;align-items:center;gap:4px;background:var(--grp);border-radius:999px;padding:4px}

.stepper span{min-width:56px;text-align:center;font-size:22px;font-weight:500;letter-spacing:-.02em}

.ns .prev .hz-card{position:relative;min-height:260px;cursor:default}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;margin-top:12px}

.sgrid .s{font-family:var(--mono);font-size:13px}
.sgrid small{display:block;font-size:11px;color:var(--muted)}
.done{background:#EAF6F0;border-radius:18px;padding:16px 18px;font-size:14px}

}

    case "ncrneden": if (!r) return; var nn = r.ncr.find(function (x) { return x.id === b.dataset.id; }); if (nn && HTIP_BY[nn.tip]) { var nd = HTIP_BY[nn.tip].neden[+b.dataset.i]; if (nn.neden === nd[0]) { nn.neden = ""; } else { nn.neden = nd[0]; nn.sinif = nd[1]; } } save(); break;
    case "sug1": var sr = S.records.find(function (x) { return x.id === b.dataset.r; }); var sn = sr && (sr.ncr || []).find(function (x) { return x.id === b.dataset.id; }); if (sn && applySug(sn)) { save(); toast("Öneri uygulandı."); } break;
    case "sugall": var cA = 0, cF = 0; allNcr().forEach(function (x) { if (applySug(x.n)) cA++; }); allFire().forEach(function (x) { if (!x.f.sinif) { var fs = suggestFire(x.r, x.f); if (fs) { x.f.sinif = fs; cF++; } } }); save(); toast(cA + " uygunsuzluk ve " + cF + " fire kaydına öneri uygulandı. Kontrol edip gerekirse düzeltin."); break;
    case "hf": ui.hf = v; break;
    case "hs": ui.hs = v; break;
    case "normst": var cN = normalizeAll(); save(); toast(cN ? cN + " istasyon adı standartlaştırıldı." : "Düzeltilecek istasyon adı yok."); break;
    case "printh": printHatalar(); return;
    case "gotonc": ui.view = "kontrol"; ui.rec = b.dataset.r; ui.tab = "ncr"; window.scrollTo(0, 0); break;
    case "fireadd": if (!r) return; r.fire = r.fire || []; r.fire.push({ code: "", qty: "", station: "", explanation: "" }); save(); break;
    case "firedel": if (!r) return; r.fire.splice(+b.dataset.i, 1); save(); break;
    case "print": if (r) printRec(r); return;
    case "printan": printAnaliz(); return;
    case "delrec": if (!r || !confirm("Kontrol kartı " + (r.serial || "") + " silinsin mi?")) return; S.records = S.records.filter(function (x) { return x.id !== r.id; }); ui.rec = null; save(); break;
    case "seedload": if (!window.__QC_SEED || !confirm("Tarayıcıdaki " + S.records.length + " kart, dosyadaki " + window.__QC_SEED.records.length + " kartla değiştirilecek. Önce yedek almanız önerilir. Devam edilsin mi?")) return; S = JSON.parse(JSON.stringify(window.__QC_SEED)); S.settings = Object.assign({}, DEF.settings, S.settings || {}); normalizeAll(); save(); toast(S.records.length + " kart yüklendi."); break;
    case "export": download("VARMEKS_QC_yedek_" + today() + ".json", JSON.stringify(S, null, 1)); toast("Yedek indirildi."); return;
    case "import": var fi = document.getElementById("fileIn"); if (fi) fi.click(); return;
    case "nlocal":
      var raw = null; try { raw = localStorage.getItem("vrm-tracker-v2"); } catch (e) {}
      if (!raw) { toast("Bu tarayıcıda Note Loop verisi bulunamadı. Note Loop'tan yedek indirip dosyadan aktarın."); return; }
      try { var cnt = fromNoteLoop(JSON.parse(raw)); toast(cnt ? cnt + " kart aktarıldı." : "Aktarılacak yeni kart bulunamadı."); if (cnt) { ui.view = "kontrol"; ui.rec = null; } } catch (e) { toast("Note Loop verisi okunamadı."); }
      break;
    case "togrec": S.settings.showRec = !!b.checked; save(); break;
    case "csync": if (cloud.user) cloudStart(); else if (cloud.sb) showLogin(); return;
    case "logout": cloudLogout(); return;
    case "wipe": if (!confirm("Tüm kontrol kartları silinecek" + (cloud.user ? " (buluttan da)" : "") + ". Emin misiniz?")) return; S.records = []; save(); toast("Tüm kartlar silindi."); break;
    default: return;
  }
  render();
});

/* ---------------- render ---------------- */
function render() {
  renderNav();
  var v = document.getElementById("v"), r = curRec(), h;
  if (ui.view === "kontrol" && r) h = viewDetail(r);
  else if (ui.view === "kontrol") { ui.rec = null; h = viewList(); }
  else if (ui.view === "yeni") h = viewYeni();
  else if (ui.view === "hatalar") h = viewHatalar();
  else if (ui.view === "analiz") h = viewAnaliz();
  else if (ui.view === "veri") h = viewVeri();
  else h = viewPanel();
  v.innerHTML = '<div class="wrap">' + h + '</div>';
  paintCloud();
  if (ui.view === "panel") hzMount(); else hzStop();
}
if (normalizeAll()) save();
render();
cloudInit();
window.__QC = { cloud: cloud, SYN: function () { return SYN; }, S: function () { return S; }, ui: ui, evalRec: evalRec, itemsFor: itemsFor, analysisData: analysisData };
})();

</script>
